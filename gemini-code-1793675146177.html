    }
    :root[data-theme=dark] {
      --bg: #17191F; --card: #1F2229; --soft: #262A32; --tx: #F0EEE8; --mut: #A3A8AF; --bd: #2D313A;
      --pri: #A8B5A0; --prit: #17191F; --navy: #A8B5A0; --blue: #A8B5A0; --ok: #A8B5A0; --err: #D08A7C; --red: #D08A7C;
      --l1: #3A4A40; --l2: #7E9283; --l3: #A8B5A0; --bn: #121418;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg); color: var(--tx); font: 15px/1.6 Inter, system-ui, -apple-system, sans-serif;

    .wrap { max-width: 960px; margin: 0 auto; }

    h2 { font-size: 18px; margin: 0 0 12px; letter-spacing: -.01em; font-weight: 700; }

    .ring { width: 92px; height: 92px; color: var(--tx); }

    .seg .on { background: var(--card); color: var(--tx); box-shadow: 0 0 0 1px var(--bd); }
    
    /* Buttons */

    .btn.o { background: transparent; color: var(--tx); border: 1px solid var(--bd); }

    /* Tags & Progress */
    .pb { height: 7px; background: var(--bd); border-radius: 9px; overflow: hidden; }

    .tag.r { background: rgba(164,87,74,.1); color: var(--err); border-color: transparent; }

    .opt { display: block; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--bd); border-radius: 12px; padding: 12px 16px; margin: 8px 0; cursor: pointer; line-height: 1.5; transition: border-color .15s, background .15s; }

    /* Tables & Details */
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    td, th { padding: 10px 6px; border-bottom: 1px solid var(--bd); text-align: left; vertical-align: top; }

    details[open] > .clamp { -webkit-line-clamp: unset; display: block; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 6px; }

    .grid .a { background: var(--pri); color: var(--prit); border-color: transparent; }
    .grid .m { border-color: var(--champ); box-shadow: inset 0 0 0 2px var(--champ); }
    .grid .n { outline: 2px solid var(--tx); }
    
    /* Chat & Assistant */
    .chat-container { display: flex; flex-direction: column; height: 520px; max-width: 820px; border: 1px solid var(--bd); border-radius: var(--r); background: var(--card); overflow: hidden; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth; }
    .bub { padding: 14px 18px; border-radius: 16px; max-width: 88%; line-height: 1.6; position: relative; overflow-wrap: anywhere; }
    .bub.user { align-self: flex-end; background: var(--forest); color: #F7F6F2; white-space: pre-wrap; }
    .bub.assistant { align-self: flex-start; background: var(--soft); border: 1px solid var(--bd); }
    .bub.error { align-self: center; background: rgba(164,87,74,.15); color: var(--err); border: 1px solid var(--err); width: 100%; text-align: center; }
    .chat-input-area { padding: 14px; background: var(--card); border-top: 1px solid var(--bd); display: flex; gap: 10px; align-items: flex-end; }
    .chat-input-area textarea { flex: 1; max-height: 120px; min-height: 46px; }
    .md p { margin: 0 0 .7em; } .md ul, .md ol { margin: .3em 0 .8em; padding-left: 1.3em; }
    .md h4 { margin: .8em 0 .3em; } .md pre { background: var(--bg); padding: 12px; border-radius: 10px; overflow-x: auto; font-size: 13px; }
    .md code { background: var(--bg); padding: 1px 5px; border-radius: 5px; font-size: .9em; } .md pre code { padding: 0; background: none; }
    .md :last-child { margin-bottom: 0; }
    .typing-indicator span { display: inline-block; width: 6px; height: 6px; background: currentColor; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; margin: 0 2px; }
    .typing-indicator span:nth-child(2) { animation-delay: .2s; }
    .typing-indicator span:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1.0); } }

    /* Memory Game */
    .mboard { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 16px; }
    .mw { perspective: 900px; min-width: 0; display: flex; }
    .mc { flex: 1; display: block; min-width: 0; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; font: inherit; color: inherit; text-align: left; border-radius: 16px; }
    .mi { display: grid; height: 100%; min-height: 132px; transform-style: preserve-3d; transition: transform .45s cubic-bezier(.4,.2,.2,1); }
    .mf { grid-area: 1/1; display: flex; flex-direction: column; justify-content: center; border-radius: 16px; border: 1px solid var(--bd); padding: 12px; overflow-wrap: anywhere; backface-visibility: hidden; min-width: 0; }
    .mf.bk { background: var(--forest); color: var(--champ); align-items: center; font: 700 34px/1 var(--hd); border-color: transparent; }
    .mf.fr { background: var(--card); transform: rotateY(180deg); font-size: 13.5px; line-height: 1.4; gap: 4px; }
    .mc.up .mi { transform: rotateY(180deg); }
    .mc.ok .mf.fr { border-color: var(--ok); background: rgba(76,107,85,.14); }
    
    /* Toasts */
    #toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 10px); background: var(--char); color: #F7F6F2; padding: 10px 18px; border-radius: 99px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 50; }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media(min-width: 821px) { #toast { bottom: 32px; } }
    
    @media(max-width: 820px) {
      nav { top: auto; left: 0; right: 0; bottom: 0; width: 100%; height: auto; flex-direction: row; padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px)); gap: 2px; border-top: 1px solid rgba(255,255,255,.08); }
      nav a { flex: 1; min-width: 0; min-height: 54px; padding: 6px 2px; font-size: 10.5px; } nav a.on::before { left: 30%; right: 30%; top: 0; bottom: auto; width: auto; height: 2px; border-radius: 0 0 3px 3px; }
      main { margin-left: 0; padding: 24px 16px calc(100px + env(safe-area-inset-bottom, 0px)); }
      h1 { font-size: 24px; }
    }
  </style>

        goal: 15
      }, S);
    }
    function saveState() {
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
    }
    loadState();

    const examDate = () => new Date(S.date + 'T00:00:00');
    const daysLeft = () => Math.max(0, Math.ceil((examDate() - Date.now()) / DAY));
    function getStreak() {
      const days = {};
      S.hist.forEach(x => days[dk(x.t)] = 1);
      let n = 0;
      for (let i = 0; ; i++) {
        if (days[dk(Date.now() - i * DAY)]) n++;
        else if (i > 0) break;
      }
      return n;
    }
    function topicsOf(c) { return c === 'esp' ? (D.syl.esp[S.cargo] || D.syl.esp["Professor (Anos Iniciais / Educação Infantil)"]) : D.syl[c]; }
    function sylStat(c) {
      const t = topicsOf(c);
      const k = i => S.syl[`${c}:${S.cargo}:${i}`] || 0;
      const done = t.filter((_, i) => k(i) >= 2).length;
      return { t, k, done };
    }
    function toast(msg) {
      let t = document.getElementById('toast');
      if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
      t.textContent = msg; t.className = 'show';
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => t.className = '', 2400);
    }

    const ICON = {
      home: '<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
      estudo: '<path d="M4 4h12a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3z"/><path d="M8 8h7"/>',
      sim: '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 14l2 2 4-4"/>',
      erros: '<path d="M12 9v4m0 4h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/>',
      ia: '<path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/>',
      perfil: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>'
    };
    const renderIcon = k => `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg>`;

    const SEC = {
      home: { n: 'Início', t: [['home', 'Geral']] },
      estudo: { n: 'Estudar', t: [['trilha', 'Trilha'], ['cartoes', 'Jogo da Memória']] },
      sim: { n: 'Simulados', t: [['praticar', 'Praticar']] },
      erros: { n: 'Erros', t: [['erros', 'Caderno de Erros']] },
      ia: { n: 'Assistente', t: [['ia', 'Assistente IA']] },
      perfil: { n: 'Perfil', t: [['edital', 'Edital Oficial'], ['config', 'Ajustes']] }
    };

    const ALIAS = {
      dashboard: 'home/home', trilha: 'estudo/trilha', cartoes: 'estudo/cartoes',
      praticar: 'sim/praticar', erros: 'erros/erros', ia: 'ia/ia',
      edital: 'perfil/edital', config: 'perfil/config'
    };

    const V = {};

    V.home = () => {
      const d = daysLeft();
      const st = getStreak();
      const allT = ['esp','lp','mat'].flatMap(c => topicsOf(c).map((t, i) => ({ c, i, t: t.t, k: `${c}:${S.cargo}:${i}` })));
      const doneCnt = allT.filter(x => (S.syl[x.k] || 0) >= 2).length;
      return `
        <h1>Aprova Professor 2026</h1>
        <p class="sub">Concurso Público de Conceição do Almeida/BA — Cargo: <b>${esc(S.cargo)}</b></p>
        <div class="c hero">
          <div class="mut" style="color:#C9D2C3">Foco Total na Aprovação</div>
          <h2 style="font-size:22px; margin:4px 0 2px; color:#fff">Faltam ${d} dias para a Prova</h2>
          <div style="color:#C9D2C3; font-size:14px">Estude com o assistente IA especializado e garanta sua vaga.</div>
          <div class="row" style="margin-top:16px">
            <button class="btn r" onclick="go('ia')">Conversar com Assistente IA</button>
            <button class="btn o" style="color:#fff; border-color:rgba(255,255,255,.3)" onclick="go('trilha')">Ver Trilha do Edital</button>
          </div>
        </div>
      `;
    };

    V.trilha = () => {
      const c = S.course || 'esp';
      const s = sylStat(c);
      return `
        <h1>Trilha de Estudos</h1>
        <div class="seg">
          <button class="${c === 'esp' ? 'on' : ''}" onclick="S.course='esp'; render();">Específicos</button>
          <button class="${c === 'lp' ? 'on' : ''}" onclick="S.course='lp'; render();">Português</button>
          <button class="${c === 'mat' ? 'on' : ''}" onclick="S.course='mat'; render();">Matemática</button>
        </div>
        <div class="c list" style="margin-top:14px; padding:6px 18px">
          ${s.t.map((t, i) => `
            <details>
              <summary>${i + 1}. ${esc(t.t)}</summary>
              <p class="mut" style="margin:8px 0">${esc(t.d)}</p>
            </details>
          `).join('')}
        </div>
      `;
    };

    V.praticar = () => `
      <h1>Praticar Questões</h1>
      <div class="c">
        <p>Resolva questões oficiais da banca Objetiva e utilize o Assistente IA para tirar dúvidas sobre o gabarito.</p>
        <button class="btn" onclick="go('ia') tirar dúvida de questão">Perguntar à IA sobre Questões</button>
      </div>
    `;

    V.erros = () => `
      <h1>Caderno de Erros</h1>
      <div class="c"><p class="mut">Revise os tópicos onde encontrou dificuldades conversando com o assistente IA.</p></div>
    `;

    /* --- REAL AI ASSISTANT VIEW & LOGIC --- */
    V.ia = () => {
      return `
        <h1>Assistente de Estudos IA</h1>
        <p class="sub">Tutor inteligente especializado no edital de Conceição do Almeida 2026. Tire dúvidas sobre LDB, BNCC, Piaget, Vygotsky, simulados e planejamento.</p>

        <div class="chat-container">
          <div class="chat-messages" id="chat-messages">
            ${(S.chat || []).length === 0 ? `
              <div class="bub assistant">
                <div class="md">Olá! Sou seu tutor IA para o concurso de <b>Conceição do Almeida 2026</b>. Como posso ajudar na sua preparação hoje? Você pode me pedir explicações conceituais, simulados, cronogramas ou tirar dúvidas sobre a legislação (LDB, ECA, BNCC).</div>
              </div>
            ` : ''}
            ${(S.chat || []).map(m => `
              <div class="bub ${m.role}">
                <div class="md">${formatMarkdown(m.content)}</div>
              </div>
            `).join('')}
          </div>
          
          <div class="chat-input-area">
            <textarea id="chat-input" rows="1" placeholder="Digite sua dúvida (ex: Qual a diferença entre avaliação formativa e somativa?)..." onkeydown="handleChatKey(event)"></textarea>
            <button class="btn r" id="chat-send-btn" onclick="sendChatMessage()">Enviar</button>
          </div>
        </div>
      `;
    };

    function formatMarkdown(text) {
      if (!text) return '';
      // Basic secure markdown formatting helper
      let html = esc(text);
      // Code blocks
      html = html.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
      // Inline code
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
      // Bold
      html = html.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
      // Bullet points
      html = html.replace(/^\s*[-*]\s+(.*)$/gm, '<li>$1</li>');
      html = html.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');
      // Paragraphs
      html = html.replace(/\n\n/g, '</p><p>');
      return `<p>${html}</p>`;
    }

    function handleChatKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendChatMessage();
      }
    }

    async function sendChatMessage() {
      const input = document.getElementById('chat-input');
      const sendBtn = document.getElementById('chat-send-btn');
      const messagesContainer = document.getElementById('chat-messages');
      
      if (!input || !input.value.trim()) return;
      const text = input.value.trim();
      input.value = '';

      // Append user message
      S.chat = S.chat || [];
      S.chat.push({ role: 'user', content: text });
      saveState();

      // Render updated chat with typing indicator
      renderChatOnly();

      // Disable inputs during request
      if (input) input.disabled = true;
      if (sendBtn) sendBtn.disabled = true;

      try {
        const response = await fetch('http://localhost:3000/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: S.chat,
            cargo: S.cargo
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Erro ao comunicar com o servidor.');
        }

        S.chat.push({ role: 'assistant', content: data.reply });
        saveState();
      } catch (err) {
        console.error('Chat error:', err);
        S.chat.push({ 
          role: 'error', 
          content: 'Não foi possível gerar uma resposta no momento. Verifique se o servidor backend está rodando e se a chave de API está configurada corretamente. Tente novamente.' 
        });
      } finally {
        saveState();
        renderChatOnly();
        const newInput = document.getElementById('chat-input');
        const newBtn = document.getElementById('chat-send-btn');
        if (newInput) { newInput.disabled = false; newInput.focus(); }
        if (newBtn) newBtn.disabled = false;
      }
    }

    function renderChatOnly() {
      const container = document.getElementById('chat-messages');
      if (!container) { render(); return; }
      
      container.innerHTML = S.chat.map(m => {
        if (m.role === 'error') {
          return `<div class="bub error">${esc(m.content)}</div>`;
        }
        return `
          <div class="bub ${m.role}">
            <div class="md">${formatMarkdown(m.content)}</div>
          </div>
        `;
      }).join('') + `
        <div id="chat-bottom"></div>
      `;
      container.scrollTop = container.scrollHeight;
    }

    V.cartoes = () => `<h1>Jogo da Memória</h1><div class="c"><p class="mut">Treine conceitos pedagógicos.</p></div>`;
    V.edital = () => `<h1>Edital Oficial</h1><div class="c"><p>Concurso de Conceição do Almeida 2026.</p></div>`;
    V.config = () => `
      <h1>Configurações</h1>
      <div class="c form">
        <label>Cargo:
          <select onchange="S.cargo=this.value; saveState(); render();">
            ${D.cargos.map(c => `<option ${c[0] === S.cargo ? 'selected' : ''}>${esc(c[0])}</option>`).join('')}
          </select>
        </label>
      </div>
    `;

    const $ = s => document.querySelector(s);

    function render() {
      const hash = (location.hash || '#home').slice(1);
      const target = ALIAS[hash] || hash;
      const [secKey, pageKey] = target.split('/');

      const currentSec = SEC[secKey] ? secKey : 'home';
      const secObj = SEC[currentSec];
      const tabs = secObj.t;
      const currentTab = tabs.some(x => x[0] === pageKey) ? pageKey : tabs[0][0];

      $('#nav').innerHTML = Object.keys(SEC).map(k => `
        <a href="#${k}" class="${k === currentSec ? 'on' : ''}">
          ${renderIcon(k)}
          <span>${SEC[k].n}</span>
        </a>
      `).join('');

      const renderFn = V[currentTab] || V.home;
      $('#main').innerHTML = `
        <div class="wrap">
          ${tabs.length > 1 ? `
            <div class="tabs">
              ${tabs.map(x => `<a href="#${currentSec}/${x[0]}" class="${x[0] === currentTab ? 'on' : ''}">${x[1]}</a>`).join('')}
            </div>
          ` : ''}
          ${renderFn()}
        </div>
      `;

      if (currentTab === 'ia') {
        const cMsg = document.getElementById('chat-messages');
        if (cMsg) cMsg.scrollTop = cMsg.scrollHeight;
      }
    }

    window.addEventListener('hashchange', render);
    window.addEventListener('DOMContentLoaded', render);
    render();
  </script>
</body>
</html>
